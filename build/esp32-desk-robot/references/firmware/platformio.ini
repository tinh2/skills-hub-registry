; Desk robot starter: ESP32-WROOM-32 DevKit ("esp32dev") + SH1106 OLED.
; For an ESP32-S3 or C3 board change `board` (esp32-s3-devkitc-1, esp32-c3-devkitm-1)
; and check which pins your board uses for I2C.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    olikraus/U8g2@^2.35.9
